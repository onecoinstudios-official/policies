<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Policies — One Coin Studios</title>
  <meta name="description" content="Privacy policy for Bento Rush by One Coin Studios: local scores, contextual family-safe ads, anonymous usage counts and crash diagnostics. No account, no profile, no advertising ID.">
  <link rel="canonical" href="https://onecoinstudios-official.github.io/policies/">

  <link rel="icon" href="assets/favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <meta name="theme-color" content="#FBF6EB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1B1216" media="(prefers-color-scheme: dark)">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="One Coin Studios">
  <meta property="og:title" content="Policies — One Coin Studios">
  <meta property="og:description" content="Bento Rush: local scores, contextual family-safe ads, anonymous usage counts. No account, no profile.">
  <meta property="og:url" content="https://onecoinstudios-official.github.io/policies/">
  <meta property="og:image" content="https://onecoinstudios-official.github.io/policies/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    :root {
      color-scheme: light dark;
      --paper: #FBF6EB;
      --paper-soft: #F4E9D7;
      --card: #FDFCF6;
      --ink: #271B21;
      --ink-soft: #5B4D4B;
      --accent: #713129;
      --accent-strong: #8A3B2A;
      --gold: #FCBD39;
      --sky: #77D6FD;
      --rule: #E3D3BB;
      --shadow: 0 20px 60px rgba(39, 27, 33, 0.12);
      --logo-shadow: 0 10px 24px rgba(39, 27, 33, 0.16);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #1B1216;
        --paper-soft: #271B21;
        --card: #271B21;
        --ink: #FDFCF6;
        --ink-soft: #C9BBB6;
        --accent: #9EDDFF;
        --accent-strong: #77D6FD;
        --rule: #422D30;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.42);
        --logo-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
      }
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background:
        radial-gradient(circle at 8% -8%, color-mix(in srgb, var(--gold) 20%, transparent) 0%, transparent 38rem),
        radial-gradient(circle at 96% 2%, color-mix(in srgb, var(--sky) 16%, transparent) 0%, transparent 32rem),
        var(--paper);
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.65;
    }

    a {
      color: var(--accent);
      text-underline-offset: 0.18em;
      text-decoration-thickness: 0.08em;
    }
    a:hover { color: var(--accent-strong); }
    a:focus-visible {
      outline: 3px solid var(--sky);
      outline-offset: 3px;
      border-radius: 0.2rem;
    }

    main { width: min(100%, 36rem); }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 1.75rem;
      color: inherit;
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: 56px;
      height: auto;
      border-radius: 13px;
      box-shadow: var(--logo-shadow);
      flex: none;
    }

    .brand-divider {
      width: 1px;
      height: 2.1rem;
      background: var(--rule);
      flex: none;
    }

    .wordmark {
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      line-height: 1.2;
    }
    .wordmark span {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--ink-soft);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin: 0 0 0.65rem;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .eyebrow::before {
      content: "";
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 26%, transparent);
    }

    h1 {
      margin: 0 0 0.6rem;
      font-size: clamp(2rem, 7vw, 2.6rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 0 0 1.75rem;
      color: var(--ink-soft);
      font-size: 1.05rem;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.35rem 1.5rem;
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 1rem;
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: transform 150ms ease, border-color 150ms ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-2px);
      border-color: var(--accent-strong);
    }

    .card-text { min-width: 0; }

    .card .game {
      display: block;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.2rem;
    }
    .card .title {
      display: block;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }
    .card .meta {
      display: block;
      margin-top: 0.3rem;
      color: var(--ink-soft);
      font-size: 0.9rem;
    }

    .card .arrow {
      margin-left: auto;
      flex: none;
      width: 2.25rem;
      height: 2.25rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: color-mix(in srgb, var(--gold) 28%, transparent);
      color: var(--ink);
      font-size: 1.1rem;
      font-weight: 800;
    }

    footer {
      margin-top: 2.5rem;
    }

    .footer-banner img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 1rem;
      border: 1px solid var(--rule);
      box-shadow: var(--shadow);
    }

    .copyright {
      margin: 1.1rem 0 0;
      color: var(--ink-soft);
      font-size: 0.85rem;
    }

    @media print {
      :root {
        --paper: #fff;
        --card: #fff;
        --ink: #000;
        --ink-soft: #333;
        --accent: #000;
        --rule: #ccc;
        --shadow: none;
        --logo-shadow: none;
      }
      body { background: #fff; }
      .footer-banner { display: none; }
      .card { border: 1px solid #ccc; }
    }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="./">
      <img src="assets/one-coin-logo.png" alt="One Coin Studios" width="512" height="512">
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="wordmark">
        Bento Rush
        <span>by One Coin Studios</span>
      </span>
    </a>

    <p class="eyebrow">One Coin Studios</p>
    <h1>Policies</h1>
    <p class="intro">What every game we ship does with your information.</p>

    <a class="card" href="bento-rush.html">
      <span class="card-text">
        <span class="game">Bento Rush</span>
        <span class="title">Privacy Policy</span>
        <span class="meta">Version 1.2 · Updated 5 November 2026</span>
      </span>
      <span class="arrow" aria-hidden="true">&rarr;</span>
    </a>

    <footer>
      <div class="footer-banner">
        <picture>
          <source srcset="assets/one-coin-banner.webp" type="image/webp">
          <img src="assets/one-coin-banner.png"
               alt="One Coin Studios: small games, big dreams. Better games together."
               width="1400" height="560" loading="lazy">
        </picture>
      </div>
      <p class="copyright">&copy; 2026 One Coin Studios. All rights reserved.</p>
    </footer>
  </main>
</body>
</html>
